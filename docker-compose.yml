# Local audio server for the companion's voice features.
#
# Ollama / LM Studio can't do audio, so speech-to-text (and later text-to-speech) runs here:
# Speaches (formerly faster-whisper-server) exposes OpenAI-compatible endpoints —
#   /v1/audio/transcriptions  (speech-to-text, used now by /transcribe)
#   /v1/audio/speech          (text-to-speech, for the upcoming voice-output step)
# so the same container covers both. The companion just points its Transcription (and later TTS)
# BaseUrl at http://localhost:8000/v1 — see docs/AUDIO.md.
#
#   docker compose up -d speaches      # start it
#   docker compose logs -f speaches    # watch (first model download is slow)
#   docker compose down                # stop it

services:
  speaches:
    # CPU image (works everywhere). For an NVIDIA GPU: switch this to :latest-cuda and
    # uncomment the `deploy:` block below.
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: companion-speaches
    ports:
      - "8000:8000"
    volumes:
      # Persist downloaded models so they aren't re-fetched on every restart.
      - speaches-models:/root/.cache/huggingface
    restart: unless-stopped
    # --- NVIDIA GPU (optional) ---
    # Requires the NVIDIA Container Toolkit on the host, and image :latest-cuda above.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  speaches-models:

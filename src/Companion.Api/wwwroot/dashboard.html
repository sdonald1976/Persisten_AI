<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Her Mind — Percoachtent Companion</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --panel: #fff; --ink: #1b1d21; --muted: #6b7280;
      --line: #e3e6ea; --accent: #2563eb; --warn: #d97706; --ok: #16a34a; --shared: #7c3aed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --panel: #1e2127; --ink: #e8eaed; --muted: #9aa2ad;
        --line: #333842; --accent: #60a5fa; --warn: #f59e0b; --ok: #22c55e; --shared: #a78bfa;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; padding: 12px 18px; border-bottom: 1px solid var(--line);
      background: var(--panel); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header a { color: var(--accent); text-decoration: none; font-size: 13.5px; }
    #status { margin-left: auto; font-size: 12.5px; color: var(--muted); }
    nav { display: flex; gap: 6px; padding: 10px 18px 0; max-width: 980px; margin: 0 auto; flex-wrap: wrap; }
    nav button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      border-radius: 999px; padding: 6px 16px; cursor: pointer; font: inherit; font-size: 13.5px; }
    nav button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    main { max-width: 980px; margin: 0 auto; padding: 14px 18px 40px; }
    section { display: none; }
    section.on { display: block; }
    .card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
      padding: 14px 16px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 14px; }
    .item { border-top: 1px solid var(--line); padding: 9px 0; }
    .item:first-of-type { border-top: none; }
    .meta { color: var(--muted); font-size: 12px; }
    .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line);
      color: var(--muted); margin-left: 6px; white-space: nowrap; }
    .badge.owner-Shared { border-color: var(--shared); color: var(--shared); }
    .badge.owner-Companion { border-color: var(--warn); color: var(--warn); }
    .badge.st-Open, .badge.st-Pending, .badge.st-Active { border-color: var(--ok); color: var(--ok); }
    .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
    label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
    input[type=text], textarea, select { width: 100%; padding: 9px 12px; border: 1px solid var(--line);
      border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
    textarea { font: 13px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .row .grow { flex: 1; }
    button.save { border: none; background: var(--accent); color: #fff; border-radius: 8px;
      padding: 7px 18px; cursor: pointer; font: inherit; }
    .saved { color: var(--ok); font-size: 12.5px; opacity: 0; transition: opacity .3s; }
    .saved.show { opacity: 1; }
    .filter { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .filter button { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
    .filter button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>🧠 Her Mind</h1>
    <a href="/">← back to chat</a>
    <a href="/prompts.html">📝 prompt editor</a>
    <span id="status">loading…</span>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>

  <script>
    const statusEl = document.getElementById('status');
    const navEl = document.getElementById('nav');
    const mainEl = document.getElementById('main');

    function authHeaders(extra) {
      const h = extra || {};
      const t = localStorage.getItem('companionApiToken') || '';
      if (t) h['Authorization'] = 'Bearer ' + t;
      return h;
    }
    async function get(path) {
      const res = await fetch(path, { headers: authHeaders() });
      if (!res.ok) throw new Error(path + ' → ' + res.status);
      return res.json();
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function when(s) { return s ? new Date(s).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : ''; }
    function card(title, bodyHtml) { return '<div class="card"><h3>' + title + '</h3>' + bodyHtml + '</div>'; }
    function items(list, render, emptyText) {
      return list.length ? list.map(render).join('') : '<div class="empty">' + emptyText + '</div>';
    }

    const TABS = {
      mind: { label: '💭 Her mind', render: renderMind },
      tastes: { label: '❤️ Her tastes', render: renderTastes },
      memories: { label: '📚 Memories', render: renderMemories },
      moments: { label: '✨ Shared moments', render: renderMoments },
      outreach: { label: '📱 Outreach', render: renderOutreach },
      character: { label: '🎭 Character', render: renderCharacter },
    };
    let active = location.hash.slice(1) || 'mind';

    function buildNav() {
      navEl.innerHTML = '';
      for (const [key, t] of Object.entries(TABS)) {
        const b = document.createElement('button');
        b.textContent = t.label;
        b.className = key === active ? 'on' : '';
        b.onclick = () => { active = key; location.hash = key; buildNav(); show(); };
        navEl.appendChild(b);
      }
    }

    async function show() {
      mainEl.innerHTML = '<div class="empty">loading…</div>';
      try {
        mainEl.innerHTML = '';
        await TABS[active].render();
        statusEl.textContent = 'live';
      } catch (e) {
        statusEl.textContent = String(e.message || e);
        mainEl.innerHTML = '<div class="empty">Couldn\'t load — is the API running (and your token set on the chat page)?</div>';
      }
    }

    // ---- her mind: diary, wonderings, dates she's holding ----

    // Trigger a reflection pass on demand (the worker normally runs one after ~30 idle minutes).
    async function reflectNow(btn) {
      btn.disabled = true; btn.textContent = '🌙 Reflecting…';
      try {
        const res = await fetch('/reflect', { method: 'POST', headers: authHeaders() });
        if (!res.ok) throw new Error('/reflect → ' + res.status);
        const r = await res.json();
        statusEl.textContent = r.reflected
          ? (r.quietDay ? 'reflected — a quiet day, nothing worth musing on' : 'reflected ✓')
          : (r.reason || 'nothing new enough to think about');
        await show(); // re-render so a fresh musing/curiosity appears immediately
      } catch (e) {
        btn.disabled = false; btn.textContent = '🌙 Reflect now';
        statusEl.textContent = String(e.message || e);
      }
    }

    async function renderMind() {
      const [reflections, curiosities, anticipations, loops] = await Promise.all([
        get('/reflections'), get('/curiosities'), get('/anticipations'), get('/loops'),
      ]);
      mainEl.innerHTML =
        '<div class="row" style="margin-bottom:10px"><button class="save" ' +
          'onclick="reflectNow(this)" title="Run the between-sessions thinking pass right now ' +
          'instead of waiting for the idle window">🌙 Reflect now</button></div>' +
        card('Diary — what she\'s been thinking between conversations',
          items(reflections, r => '<div class="item">' + esc(r.musing) +
            '<div class="meta">' + when(r.createdAt) + ' · reflected over ' + r.messagesReflected + ' messages</div></div>',
            'No musings yet — they form while you\'re away (or POST /reflect to trigger one).')) +
        card('Open curiosities — what she wants to know',
          items(curiosities, c => '<div class="item">' + esc(c.question) +
            (c.about ? '<span class="badge">' + esc(c.about) + '</span>' : '') +
            '<div class="meta">' + esc(c.reason || '') + ' · ' + when(c.createdAt) + '</div></div>',
            'Nothing she\'s wondering right now.')) +
        card('Anticipations — dates she\'s holding for you',
          items(anticipations, a => '<div class="item">' + esc(a.description) +
            '<span class="badge st-' + esc(a.status) + '">' + esc(a.status) + '</span>' +
            '<div class="meta">event: ' + when(a.eventAt) + (a.evidence ? ' · from: “' + esc(a.evidence) + '”' : '') + '</div></div>',
            'No upcoming events held.')) +
        card('Open loops — unfinished business she can recall',
          items(loops, l => '<div class="item">' + esc(l.description) + '</div>', 'No open loops.'));
    }

    // ---- her tastes ----
    async function renderTastes() {
      const prefs = await get('/preferences');
      mainEl.innerHTML =
        card('Her own opinions (never copied from yours — they evolve from her reflection)',
          items(prefs, p => '<div class="item">' + esc(p.description) +
            '<div class="meta">affinity ' + p.affinity + ' · confidence ' + p.confidence +
            ' · shaped by ' + p.observations + ' experience' + (p.observations === 1 ? '' : 's') +
            ' · updated ' + when(p.updatedAt) + '</div></div>',
            'No tastes formed yet — they emerge from real conversations.'));
    }

    // ---- memories with owner/kind filters ----
    let memFilter = 'All';
    async function renderMemories() {
      const memories = await get('/memories');
      const owners = ['All', 'User', 'Companion', 'Shared'];
      const filtered = memFilter === 'All' ? memories : memories.filter(m => m.owner === memFilter);
      mainEl.innerHTML =
        '<div class="filter">' + owners.map(o =>
          '<button class="' + (o === memFilter ? 'on' : '') + '" onclick="setMemFilter(\'' + o + '\')">' + o + '</button>').join('') +
        '</div>' +
        card('Everything she remembers (' + filtered.length + ')',
          items(filtered, m => '<div class="item">' + esc(m.content) +
            '<span class="badge">' + esc(m.kind) + '</span>' +
            '<span class="badge owner-' + esc(m.owner) + '">' + esc(m.owner) + '</span>' +
            (m.validity && m.validity !== 'Current' ? '<span class="badge">' + esc(m.validity) + '</span>' : '') +
            '<div class="meta">confidence ' + m.confidence + ' · ' + esc(m.status) +
            ' — manage by talking: “forget the … thing”, “that\'s wrong”</div></div>',
            'Nothing here yet.'));
    }
    window.setMemFilter = (o) => { memFilter = o; renderMemories(); };

    // ---- shared moments ----
    async function renderMoments() {
      const memories = await get('/memories');
      const shared = memories.filter(m => m.owner === 'Shared');
      mainEl.innerHTML =
        card('Moments you two share — minted by her reflection, always evidence-backed',
          items(shared, m => '<div class="item">' + esc(m.content) +
            '<div class="meta">confidence ' + m.confidence + '</div></div>',
            'No shared moments yet. Do something together — teach her a game, work through a problem — and let a reflection pass run.'));
    }

    // ---- outreach ----
    async function renderOutreach() {
      const log = await get('/outreach');
      mainEl.innerHTML =
        card('Messages she sent on her own initiative',
          items(log, m => '<div class="item">' + esc(m.text) +
            '<div class="meta">' + when(m.sentAt) + ' · ' + esc(m.source) + '</div></div>',
            'She hasn\'t reached out yet. Configure Outreach.NtfyUrl (docs/OUTREACH.md), then give her a reason and some time.')) +
        '<div class="meta" style="margin-top:8px">Test the wiring any time: <code>POST /outreach/test</code></div>';
    }

    // ---- character: identity, personality, persona ----
    async function renderCharacter() {
      const [identity, personality, persona] = await Promise.all([
        get('/identity'), get('/personality'), get('/persona'),
      ]);

      const presets = personality.presets.map(p =>
        '<option value="' + esc(p.name) + '"' + (p.name === personality.active.name ? ' selected' : '') + '>' +
        esc(p.label) + ' — ' + esc(p.description) + '</option>').join('');

      mainEl.innerHTML =
        card('Identity',
          '<label>Name</label><input type="text" id="idName" value="' + esc(identity.name) + '">' +
          '<label>Gender</label><input type="text" id="idGender" value="' + esc(identity.gender) + '">' +
          '<label>Pronouns</label><input type="text" id="idPronouns" value="' + esc(identity.pronouns) + '">' +
          '<div class="row"><button class="save" id="saveIdentity">Save identity</button><span class="saved" id="savedIdentity">✓ saved</span></div>') +
        card('Personality preset (the base voice)',
          '<select id="preset">' + presets + '</select>' +
          '<div class="row"><button class="save" id="savePreset">Switch personality</button><span class="saved" id="savedPreset">✓ switched</span></div>') +
        card('Persona (free-text character on top — relationship framing belongs HERE)',
          '<textarea id="personaText" rows="6" placeholder="e.g. You are Ava. Ava is the user\'s close friend; the user is …\nWrite roles in third person, both directions — never “my …”.">' +
          esc(persona.persona || '') + '</textarea>' +
          '<div class="row"><button class="save" id="savePersona">Save persona</button><span class="saved" id="savedPersona">✓ saved</span></div>' +
          '<div class="meta" style="margin-top:6px">Tip: avoid first-person possessives (“my mentor”) — small models flip who\'s who. ' +
          'State both directions explicitly. The roleplay guard reads this text live.</div>');

      wireSave('saveIdentity', 'savedIdentity', () => fetch('/identity', {
        method: 'PUT', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          name: document.getElementById('idName').value.trim() || null,
          gender: document.getElementById('idGender').value.trim() || null,
          pronouns: document.getElementById('idPronouns').value.trim() || null,
        }),
      }));
      wireSave('savePreset', 'savedPreset', () => fetch('/personality', {
        method: 'PUT', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ preset: document.getElementById('preset').value }),
      }));
      wireSave('savePersona', 'savedPersona', () => fetch('/persona', {
        method: 'PUT', headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ persona: document.getElementById('personaText').value || null }),
      }));
    }

    function wireSave(btnId, savedId, doSave) {
      document.getElementById(btnId).onclick = async () => {
        const res = await doSave();
        if (!res.ok) { statusEl.textContent = 'save failed (' + res.status + ')'; return; }
        const s = document.getElementById(savedId);
        s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1500);
      };
    }

    buildNav();
    show();
  </script>
</body>
</html>

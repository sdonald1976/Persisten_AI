<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persistent Companion</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --panel: #fff; --ink: #1b1d21; --muted: #6b7280;
      --you: #2563eb; --you-ink: #fff; --bot: #eceef1; --bot-ink: #1b1d21;
      --line: #e3e6ea; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --panel: #1e2127; --ink: #e8eaed; --muted: #9aa2ad;
        --you: #3b82f6; --you-ink: #fff; --bot: #2a2e36; --bot-ink: #e8eaed;
        --line: #333842; --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      padding: 12px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; background: var(--panel);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #status { margin-left: auto; font-size: 12px; color: var(--muted); }
    #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #d1d5db; margin-right: 5px; vertical-align: middle; }
    #status.online .dot { background: #22c55e; }
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .you { align-self: flex-end; background: var(--you); color: var(--you-ink); border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); color: var(--bot-ink); border-bottom-left-radius: 4px; }
    .sys { align-self: center; color: var(--muted); font-size: 12.5px; font-style: italic; }
    .confirm { align-self: flex-start; display: flex; gap: 8px; flex-wrap: wrap; max-width: 90%; }
    .confirm button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
    .confirm button.yes { background: var(--accent); color: #fff; border-color: var(--accent); }
    footer { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel);
      display: flex; gap: 10px; }
    #input { flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); color: var(--ink); font: inherit; resize: none; }
    #send { padding: 0 20px; border: none; border-radius: 10px; background: var(--accent);
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>🧠 Persistent Companion</h1>
    <span id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
  </header>

  <div id="log">
    <div class="sys">This page is a thin "face" over the local companion API — the brain runs headless
      behind <code>/ws</code>. Try: “what do you remember about me?”, “be more concise”, “forget that”.</div>
  </div>

  <footer>
    <textarea id="input" rows="1" placeholder="Talk to your companion…  (Enter to send)"></textarea>
    <button id="send" disabled>Send</button>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const status = document.getElementById('status');
    const statusText = document.getElementById('status-text');

    let socket, conversationId = null, currentBot = null;

    function add(cls, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    // Local API token: browsers can't set headers on a WebSocket, so it travels as ?access_token=.
    // Paste the token printed in the server console at first startup (stored locally after that).
    // If the server has auth disabled, leave it blank.
    function apiToken() {
      let t = localStorage.getItem('companionApiToken');
      if (t === null) {
        t = (window.prompt('Local API token (from the server console; leave blank if auth is disabled):') || '').trim();
        localStorage.setItem('companionApiToken', t);
      }
      return t;
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const token = apiToken();
      const q = token ? `?access_token=${encodeURIComponent(token)}` : '';
      socket = new WebSocket(`${proto}://${location.host}/ws${q}`);

      socket.onopen = () => { status.className = 'online'; statusText.textContent = 'connected'; send.disabled = false; };
      socket.onclose = () => {
        status.className = ''; statusText.textContent = 'disconnected — retrying…'; send.disabled = true;
        setTimeout(connect, 1500);
      };
      socket.onerror = () => socket.close();

      socket.onmessage = (e) => {
        const m = JSON.parse(e.data);
        switch (m.type) {
          case 'ready':
            conversationId = m.conversationId;
            // The companion opens the conversation so you don't have to. Show its message and
            // offer the memory-grounded starters as clickable chips (or just type your own).
            if (m.message) add('bot', m.message);
            if (Array.isArray(m.openers) && m.openers.length) offerOpeners(m.openers);
            break;
          case 'token':
            if (!currentBot) currentBot = add('bot', '');
            currentBot.textContent += m.text;
            log.scrollTop = log.scrollHeight;
            break;
          case 'reply':
            if (m.kind === 'Confirmation') {
              if (currentBot) currentBot = null;
              add('bot', m.text);
              offerConfirm(m.confirmationToken);
            } else if (m.kind === 'Chat') {
              if (!currentBot) add('bot', m.text); // non-streaming fallback
              currentBot = null;
            } else { // Action
              add('bot', m.text);
              currentBot = null;
            }
            break;
          case 'error':
            add('sys', '⚠ ' + m.message);
            currentBot = null;
            break;
        }
      };
    }

    function offerConfirm(token) {
      const row = document.createElement('div');
      row.className = 'msg confirm';
      const yes = document.createElement('button'); yes.className = 'yes'; yes.textContent = 'Yes';
      const no = document.createElement('button'); no.textContent = 'No';
      yes.onclick = () => { confirmChoice(token, true); row.remove(); };
      no.onclick = () => { confirmChoice(token, false); row.remove(); };
      row.append(yes, no);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function confirmChoice(token, confirmed) {
      socket.send(JSON.stringify({ type: 'confirm', token, confirmed, conversationId }));
    }

    // Render the opener suggestions as chips. Clicking one drops it into the input (you can edit
    // before sending) — you're never forced to pick one; typing anything works too.
    function offerOpeners(openers) {
      const row = document.createElement('div');
      row.className = 'msg confirm';
      openers.forEach(text => {
        const b = document.createElement('button');
        b.textContent = text;
        b.onclick = () => { input.value = text; input.focus(); };
        row.appendChild(b);
      });
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function submit() {
      const text = input.value.trim();
      if (!text || socket.readyState !== WebSocket.OPEN) return;
      add('you', text);
      currentBot = null;
      socket.send(JSON.stringify({ type: 'chat', text, conversationId }));
      input.value = '';
    }

    send.onclick = submit;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
    });

    connect();
  </script>
</body>
</html>

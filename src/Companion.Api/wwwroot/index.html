<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Persistent Companion</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --panel: #fff; --ink: #1b1d21; --muted: #6b7280;
      --you: #2563eb; --you-ink: #fff; --bot: #eceef1; --bot-ink: #1b1d21;
      --line: #e3e6ea; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d; --panel: #1e2127; --ink: #e8eaed; --muted: #9aa2ad;
        --you: #3b82f6; --you-ink: #fff; --bot: #2a2e36; --bot-ink: #e8eaed;
        --line: #333842; --accent: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      padding: 12px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 10px; background: var(--panel);
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    #status { margin-left: auto; font-size: 12px; color: var(--muted); }
    #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #d1d5db; margin-right: 5px; vertical-align: middle; }
    #status.online .dot { background: #22c55e; }
    #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
    .you { align-self: flex-end; background: var(--you); color: var(--you-ink); border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); color: var(--bot-ink); border-bottom-left-radius: 4px; }
    .sys { align-self: center; color: var(--muted); font-size: 12.5px; font-style: italic; }
    .confirm { align-self: flex-start; display: flex; gap: 8px; flex-wrap: wrap; max-width: 90%; }
    .confirm button { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
      border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
    .confirm button.yes { background: var(--accent); color: #fff; border-color: var(--accent); }
    footer { padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel);
      display: flex; gap: 10px; }
    #input { flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); color: var(--ink); font: inherit; resize: none; }
    #send { padding: 0 20px; border: none; border-radius: 10px; background: var(--accent);
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
    /* Push-to-talk mic, hands-free toggle, speak toggle */
    #mic, #hands, #speak { border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      border-radius: 10px; font-size: 18px; cursor: pointer; padding: 0 14px; line-height: 1;
      touch-action: none; user-select: none; -webkit-user-select: none; }
    #mic:disabled, #hands:disabled { opacity: .4; cursor: default; }
    #mic.recording { background: #ef4444; border-color: #ef4444; color: #fff;
      animation: pulse 1s ease-in-out infinite; }
    #hands.on { background: #16a34a; border-color: #16a34a; color: #fff; }
    #speak { font-size: 15px; margin-left: auto; }
    #hands { font-size: 15px; }
    #speak.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
      50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
    .msg.typing { display: inline-flex; gap: 5px; align-items: center; }
    .msg.typing span { width: 7px; height: 7px; border-radius: 50%; background: currentColor;
      opacity: .3; animation: blink 1.2s infinite both; }
    .msg.typing span:nth-child(2) { animation-delay: .2s; }
    .msg.typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: .9; } }
  </style>
</head>
<body>
  <header>
    <h1>🧠 Persistent Companion</h1>
    <button id="speak" title="Speak replies aloud (text-to-speech)">🔈 Speak</button>
    <span id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
  </header>

  <div id="log">
    <div class="sys">This page is a thin "face" over the local companion API — the brain runs headless
      behind <code>/ws</code>. Try: “what do you remember about me?”, “be more concise”, “forget that”.</div>
  </div>

  <footer>
    <button id="hands" title="Hands-free listening (just talk; talk over me to interrupt)">🎙️</button>
    <button id="mic" title="Hold to talk">🎤</button>
    <textarea id="input" rows="1" placeholder="Talk to your companion…  (Enter to send)"></textarea>
    <button id="send" disabled>Send</button>
  </footer>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const mic = document.getElementById('mic');
    const handsBtn = document.getElementById('hands');
    const speakBtn = document.getElementById('speak');
    const status = document.getElementById('status');
    const statusText = document.getElementById('status-text');

    let socket, conversationId = null, currentBot = null, greetingBubble = null;

    function add(cls, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    // Animated "…" bubble shown while waiting for the companion to respond (local models can take
    // a beat to warm up / process the prompt before the first token arrives).
    let typingEl = null;
    function showThinking() {
      if (typingEl) return;
      typingEl = document.createElement('div');
      typingEl.className = 'msg bot typing';
      typingEl.innerHTML = '<span></span><span></span><span></span>';
      log.appendChild(typingEl);
      log.scrollTop = log.scrollHeight;
    }
    function hideThinking() {
      if (typingEl) { typingEl.remove(); typingEl = null; }
    }

    // Local API token: browsers can't set headers on a WebSocket, so it travels as ?access_token=.
    // The token is printed in the server console at first startup and saved to a file called
    // `.companion-api-token` next to the database. If the server has auth disabled, leave it blank.
    const TOKEN_HELP =
      'Local API token — find it in the server console ("Generated a local API token…") ' +
      'or in the .companion-api-token file next to your database. Leave blank if auth is disabled.';

    // Exposed for convenience: run resetToken() in the browser console to re-enter it.
    window.resetToken = () => { localStorage.removeItem('companionApiToken'); location.reload(); };

    let authenticated = false;     // true once the server accepts us (a 'ready' frame arrives)
    let failsSinceReady = 0;       // consecutive closes before authenticating

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      // Connect with a stored token if we have one — but DON'T prompt eagerly. With auth turned
      // off (the local default), this just connects and never asks for a token.
      const token = localStorage.getItem('companionApiToken') || '';
      const q = token ? `?access_token=${encodeURIComponent(token)}` : '';
      authenticated = false;
      socket = new WebSocket(`${proto}://${location.host}/ws${q}`);

      socket.onopen = () => { status.className = 'online'; statusText.textContent = 'connected'; send.disabled = false; };
      socket.onclose = () => {
        status.className = ''; send.disabled = true;
        if (!authenticated) {
          failsSinceReady++;
          if (token) {
            // A token was sent and rejected → forget it and fall back to trying without one.
            localStorage.removeItem('companionApiToken');
            add('sys', '⚠ That token was rejected. ' + TOKEN_HELP);
            statusText.textContent = 'auth failed — re-enter token';
          } else if (failsSinceReady >= 2) {
            // Repeatedly can't connect without a token → the server probably has auth ON.
            const t = (window.prompt(TOKEN_HELP) || '').trim();
            if (t) localStorage.setItem('companionApiToken', t);
            statusText.textContent = 'retrying…';
          } else {
            statusText.textContent = 'connecting…';
          }
        } else {
          statusText.textContent = 'disconnected — retrying…';
        }
        setTimeout(connect, 1500);
      };
      socket.onerror = () => socket.close();

      socket.onmessage = (e) => {
        const m = JSON.parse(e.data);
        switch (m.type) {
          case 'ready':
            authenticated = true;
            conversationId = m.conversationId;
            // The companion opens the conversation so you don't have to. Show its message and
            // offer the memory-grounded starters as clickable chips (or just type your own).
            // The bubble is kept so a later 'greeting' frame can upgrade the wording in place.
            greetingBubble = m.message ? add('bot', m.message) : null;
            if (Array.isArray(m.openers) && m.openers.length) offerOpeners(m.openers);
            break;
          case 'greeting':
            // The model finished phrasing the opener in its own voice — swap it in. The instant
            // deterministic greeting was already shown, so this is purely a wording upgrade.
            if (m.message) {
              if (greetingBubble) greetingBubble.textContent = m.message;
              else greetingBubble = add('bot', m.message);
            }
            break;
          case 'token':
            hideThinking();
            if (!currentBot) currentBot = add('bot', '');
            currentBot.textContent += m.text;
            feedSpeech(m.text); // synthesize each sentence as it streams in
            log.scrollTop = log.scrollHeight;
            break;
          case 'reply': {
            hideThinking();
            let finalText = m.text;
            if (m.kind === 'Confirmation') {
              if (currentBot) currentBot = null;
              add('bot', m.text);
              offerConfirm(m.confirmationToken);
            } else if (m.kind === 'Chat') {
              if (currentBot) finalText = currentBot.textContent; // the streamed text
              else add('bot', m.text);                            // non-streaming fallback
              currentBot = null;
            } else { // Action
              add('bot', m.text);
              currentBot = null;
            }
            finalizeSpeech(finalText);
            break;
          }
          case 'error':
            hideThinking();
            add('sys', '⚠ ' + m.message);
            currentBot = null;
            stopSpeech();
            break;
        }
      };
    }

    function offerConfirm(token) {
      const row = document.createElement('div');
      row.className = 'msg confirm';
      const yes = document.createElement('button'); yes.className = 'yes'; yes.textContent = 'Yes';
      const no = document.createElement('button'); no.textContent = 'No';
      yes.onclick = () => { confirmChoice(token, true); row.remove(); };
      no.onclick = () => { confirmChoice(token, false); row.remove(); };
      row.append(yes, no);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function confirmChoice(token, confirmed) {
      socket.send(JSON.stringify({ type: 'confirm', token, confirmed, conversationId }));
    }

    // Render the opener suggestions as chips. Clicking one drops it into the input (you can edit
    // before sending) — you're never forced to pick one; typing anything works too.
    function offerOpeners(openers) {
      const row = document.createElement('div');
      row.className = 'msg confirm';
      openers.forEach(text => {
        const b = document.createElement('button');
        b.textContent = text;
        b.onclick = () => { input.value = text; input.focus(); };
        row.appendChild(b);
      });
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function sendText(text, viaVoice) {
      text = (text || '').trim();
      if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
      add('you', text);
      currentBot = null;
      newSpeechTurn(speakAll || viaVoice); // voice in → voice out, or speak-all toggle on
      socket.send(JSON.stringify({ type: 'chat', text, conversationId }));
      showThinking();
      input.value = '';
    }

    function submit() { sendText(input.value, false); }

    send.onclick = submit;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
    });

    // ---- voice loop: push-to-talk (mic → /transcribe → turn → /speak → speaker) ----

    // Local API token also authorizes the HTTP fetches (WebSocket used a query param instead).
    function authHeaders(extra) {
      const h = extra || {};
      const t = localStorage.getItem('companionApiToken') || '';
      if (t) h['Authorization'] = 'Bearer ' + t;
      return h;
    }

    let mediaStream = null, recorder = null, chunks = [], recording = false, micDisabled = false, recStart = 0;

    function pickMime() {
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg', 'audio/mp4'];
      for (const t of types) if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      return '';
    }

    // Echo cancellation matters for hands-free: it keeps the companion's own playback from feeding
    // back into the mic and self-triggering. Harmless for push-to-talk.
    async function ensureStream() {
      if (mediaStream) return mediaStream;
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      return mediaStream;
    }

    async function startRecording() {
      if (recording || micDisabled) return;
      stopSpeech(); // barge-in: talking over the companion stops its playback and pending speech
      try {
        await ensureStream();
        const mime = pickMime();
        recorder = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : undefined);
        chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        recorder.onstop = onRecordingStop;
        recorder.start();
        recording = true;
        recStart = performance.now();
        mic.classList.add('recording');
        statusText.textContent = 'listening…';
      } catch (err) {
        add('sys', '⚠ Microphone unavailable: ' + (err && err.message ? err.message : err));
        micDisabled = true; mic.disabled = true;
      }
    }

    function stopRecording() {
      if (!recording) return;
      recording = false;
      mic.classList.remove('recording');
      if (authenticated) statusText.textContent = 'connected';
      try { recorder.stop(); } catch {}
    }

    async function onRecordingStop() {
      const blob = new Blob(chunks, { type: (recorder && recorder.mimeType) || 'audio/webm' });
      const durMs = performance.now() - recStart;
      chunks = [];
      if (blob.size < 1200 || durMs < 250) return; // ignore an accidental tap or a VAD blip
      statusText.textContent = 'transcribing…';
      try {
        const fd = new FormData();
        fd.append('file', blob, 'speech.webm');
        const res = await fetch('/transcribe', { method: 'POST', headers: authHeaders(), body: fd });
        if (authenticated) statusText.textContent = 'connected';
        if (res.status === 503) {
          add('sys', '⚠ Speech-to-text isn’t configured on the server (set Models.Transcription — see docs/AUDIO.md).');
          micDisabled = true; mic.disabled = true; return;
        }
        if (!res.ok) { add('sys', '⚠ Transcription failed (' + res.status + ').'); return; }
        const data = await res.json();
        const text = (data.text || '').trim();
        if (text) sendText(text, true);
        else add('sys', '(didn’t catch that — try again)');
      } catch (err) {
        add('sys', '⚠ Transcription error: ' + (err && err.message ? err.message : err));
      }
    }

    // Press-and-hold anywhere on the mic; release anywhere stops (classic push-to-talk).
    mic.addEventListener('pointerdown', (e) => { e.preventDefault(); startRecording(); });
    window.addEventListener('pointerup', () => { if (recording) stopRecording(); });
    mic.addEventListener('pointercancel', () => { if (recording) stopRecording(); });
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      mic.disabled = true; mic.title = 'Microphone not supported in this browser';
      handsBtn.disabled = true; handsBtn.title = 'Microphone not supported in this browser';
    }

    // ---- hands-free: voice-activity detection (talk to speak, talk over the reply to interrupt) ----
    // A lightweight energy VAD over the mic (Web Audio AnalyserNode): speech onset starts a capture
    // (and cuts off the companion mid-sentence — barge-in), and a stretch of silence ends it,
    // handing the clip to the same transcribe→send path push-to-talk uses.

    let handsFree = false, audioCtx = null, analyser = null, vadData = null, vadTimer = null;
    let vadSpeaking = false, vadSilenceSince = 0;
    const VAD_ON = 0.055;               // RMS onset threshold in quiet listening
    const VAD_ON_WHILE_TALKING = 0.10;  // higher bar to interrupt, so the companion's own audio (post-AEC) doesn't self-trigger
    const VAD_OFF = 0.030;              // below this is silence
    const VAD_HANGOVER_MS = 700;        // trailing silence that ends an utterance
    const VAD_POLL_MS = 50;

    function rmsLevel() {
      analyser.getByteTimeDomainData(vadData);
      let sum = 0;
      for (let i = 0; i < vadData.length; i++) { const v = (vadData[i] - 128) / 128; sum += v * v; }
      return Math.sqrt(sum / vadData.length);
    }

    function vadTick() {
      if (!analyser) return;
      const now = performance.now();
      const level = rmsLevel();
      const onThreshold = currentAudio ? VAD_ON_WHILE_TALKING : VAD_ON; // harder to trigger while it's speaking
      if (!vadSpeaking) {
        if (level > onThreshold) {
          vadSpeaking = true; vadSilenceSince = 0;
          startRecording(); // captures from onset; also cuts off any playback (barge-in)
        }
      } else if (level < VAD_OFF) {
        if (!vadSilenceSince) vadSilenceSince = now;
        else if (now - vadSilenceSince >= VAD_HANGOVER_MS) {
          vadSpeaking = false; vadSilenceSince = 0;
          stopRecording(); // → transcribe → send
        }
      } else {
        vadSilenceSince = 0; // mid-level: still talking (hysteresis dead-zone)
      }
    }

    async function enableHandsFree() {
      try {
        await ensureStream();
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        vadData = new Uint8Array(analyser.fftSize);
        audioCtx.createMediaStreamSource(mediaStream).connect(analyser); // analyser is a sink; not wired to output, so no echo
        vadSpeaking = false; vadSilenceSince = 0;
        vadTimer = setInterval(vadTick, VAD_POLL_MS);
        handsFree = true;
        handsBtn.classList.add('on');
        handsBtn.title = 'Hands-free listening: on — click to turn off';
        add('sys', '🎙️ Hands-free listening is on — just start talking, and talk over me to interrupt.');
      } catch (err) {
        add('sys', '⚠ Couldn’t start hands-free listening: ' + (err && err.message ? err.message : err));
        handsFree = false;
      }
    }

    function disableHandsFree() {
      handsFree = false;
      if (vadTimer) { clearInterval(vadTimer); vadTimer = null; }
      analyser = null; vadData = null;
      if (vadSpeaking) { vadSpeaking = false; if (recording) stopRecording(); }
      handsBtn.classList.remove('on');
      handsBtn.title = 'Hands-free listening (just talk; talk over me to interrupt)';
    }

    handsBtn.onclick = () => { handsFree ? disableHandsFree() : enableHandsFree(); };

    // ---- streaming text-to-speech playback ----
    // Synthesize the reply sentence-by-sentence as it streams in and play the clips in order, so the
    // companion starts talking within a sentence instead of after the whole reply is written. Each
    // turn gets its own pipeline; a new turn or barge-in cancels the previous one.

    let currentAudio = null, speakDisabled = false, speakAll = false, speech = null;

    function newSpeechTurn(enabled) {
      stopSpeech();
      speech = (enabled && !speakDisabled)
        ? { buf: '', queue: [], playing: false, fed: false, cancelled: false }
        : null;
    }

    function stopSpeech() {
      if (speech) speech.cancelled = true;
      speech = null;
      stopAudio();
    }

    function stopAudio() {
      if (!currentAudio) return;
      const a = currentAudio; currentAudio = null;
      try { a.pause(); } catch {}
      try { URL.revokeObjectURL(a.src); } catch {}
      if (a._resolve) { const r = a._resolve; a._resolve = null; r(); } // let a paused clip's play loop advance
    }

    // Pull the next speakable chunk from the growing buffer: a whole sentence (terminal punctuation
    // followed by a space), or — when a clause runs long with no punctuation — a split at a space so
    // playback latency stays bounded. Returns null when nothing is ready yet.
    function nextChunk(s) {
      const m = /[.!?…]+["')\]]*\s/.exec(s.buf);
      if (m) {
        const end = m.index + m[0].length;
        const chunk = s.buf.slice(0, end).trim();
        s.buf = s.buf.slice(end);
        return chunk || null;
      }
      if (s.buf.length > 220) {
        let cut = s.buf.lastIndexOf(' ', 220);
        if (cut < 40) cut = 220;
        const chunk = s.buf.slice(0, cut).trim();
        s.buf = s.buf.slice(cut);
        return chunk || null;
      }
      return null;
    }

    function feedSpeech(text) {
      if (!speech) return;
      speech.fed = true;
      speech.buf += text;
      let chunk;
      while ((chunk = nextChunk(speech)) !== null) enqueueChunk(speech, chunk);
    }

    // End of the reply: speak the trailing partial sentence. For a non-streamed reply (Action /
    // Confirmation arrives whole, no tokens), synthesize the full text here instead.
    function finalizeSpeech(finalText) {
      if (!speech) return;
      if (!speech.fed && finalText) feedSpeech(finalText);
      const tail = speech.buf.trim();
      speech.buf = '';
      if (tail) enqueueChunk(speech, tail);
    }

    function enqueueChunk(s, text) {
      if (!text) return;
      s.queue.push({ p: synthAudio(text) }); // synthesis starts now; playback stays in order
      playLoop(s);
    }

    async function synthAudio(text) {
      if (speakDisabled) return null;
      try {
        const res = await fetch('/speak', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ text }),
        });
        if (res.status === 503) {
          speakDisabled = true; speakAll = false;
          speakBtn.classList.remove('on'); speakBtn.textContent = '🔈 Speak';
          add('sys', '⚠ Text-to-speech isn’t configured on the server (set Models.Speech — see docs/AUDIO.md).');
          stopSpeech();
          return null;
        }
        if (!res.ok) return null;
        return URL.createObjectURL(await res.blob());
      } catch { return null; } // speech is a nicety; never break the turn over it
    }

    // One player per pipeline (guarded by s.playing): await each queued clip's synthesis in order,
    // play it to completion, then move on — so clips never overlap even if a later one synthesizes first.
    async function playLoop(s) {
      if (s.playing || s.cancelled) return;
      s.playing = true;
      while (s.queue.length && !s.cancelled) {
        let url;
        try { url = await s.queue[0].p; } catch { url = null; }
        if (s.cancelled) { if (url) { try { URL.revokeObjectURL(url); } catch {} } break; }
        if (url) await playUrl(url);
        if (s.cancelled) break;
        s.queue.shift();
      }
      s.playing = false;
    }

    function playUrl(url) {
      return new Promise((resolve) => {
        const audio = new Audio(url);
        audio._resolve = resolve;
        currentAudio = audio;
        const done = () => {
          try { URL.revokeObjectURL(url); } catch {}
          if (currentAudio === audio) currentAudio = null;
          if (audio._resolve) { audio._resolve = null; resolve(); }
        };
        audio.onended = done; audio.onerror = done;
        audio.play().catch(done); // autoplay can be blocked until the user interacts
      });
    }

    speakBtn.onclick = () => {
      if (speakDisabled) return;
      speakAll = !speakAll;
      speakBtn.classList.toggle('on', speakAll);
      speakBtn.textContent = speakAll ? '🔊 Speak' : '🔈 Speak';
      if (!speakAll) stopSpeech();
    };

    connect();
  </script>
